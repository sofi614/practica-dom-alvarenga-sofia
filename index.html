<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galería de Superhéroes</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>
  <body>
    <header class="bg-dark text-white text-center py-4">
      <h1>Galería de Superhéroes</h1>
      <p class="mb-0">Práctica de manipulación del DOM con JavaScript</p>
    </header>

    <main class="container my-4">
      <section class="card p-3 shadow-sm mb-4">
        <h2 class="h4">Agregar personaje</h2>

        <form id="formPersonaje" class="row g-3">
          <div class="col-md-5">
            <input
              type="text"
              id="nombre"
              class="form-control"
              placeholder="Nombre del personaje"
              required
            />
          </div>

          <div class="col-md-5">
            <input
              type="url"
              id="imagen"
              class="form-control"
              placeholder="URL de imagen"
              required
            />
          </div>

          <div class="col-md-2 d-grid">
            <button class="btn btn-primary">
              <i class="bi bi-plus-circle"></i> Agregar
            </button>
          </div>
        </form>
      </section>

      <section class="card p-3 shadow-sm mb-4">
        <h2 class="h4">Buscar por nombre</h2>

        <div class="input-group">
          <input
            type="text"
            id="filtro"
            class="form-control"
            placeholder="Buscar personaje"
          />
          <button id="btnFiltrar" class="btn btn-success">
            <i class="bi bi-search"></i> Buscar
          </button>
          <button id="btnMostrarTodos" class="btn btn-secondary">
            Mostrar todos
          </button>
        </div>
      </section>

      <section>
        <div id="galeria" class="row g-4"></div>
      </section>
    </main>

    <footer class="bg-dark text-white text-center py-3">
      <p class="mb-0">Proyecto DOM con JavaScript</p>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
